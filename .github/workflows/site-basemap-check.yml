name: Site basemap recovery
on:
  push:
    branches: [fix/site-basemap-recovery, fix/site-satellite-control, fix/site-satellite-chip]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/check-site-basemap.cjs
      - name: Export map evidence
        if: always()
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,base64
          for p in Path('/tmp').glob('site-basemap-*.png'):
              image=Image.open(p).convert('RGB');image.thumbnail((1000,750));out=io.BytesIO();image.save(out,format='JPEG',quality=75)
              print(p.stem+'_BASE64 '+base64.b64encode(out.getvalue()).decode())
          PY

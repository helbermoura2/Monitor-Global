name: TV regional areas
on:
  pull_request:
    paths:
      - 'worker/tv-target-areas.mjs'
      - 'worker/tv-snapshot.mjs'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/TargetAreaNames.java'
      - 'tests/unit/tv-target-areas.test.mjs'
      - '.github/workflows/tv-target-areas.yml'
permissions:
  contents: read
jobs:
  geography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/unit/tv-target-areas.test.mjs

name: Cloudflare quota reduction operations
on:
  pull_request:
    paths:
      - 'tools/cloudflare-build-filters.py'
      - 'tools/cloudflare-route-tail.mjs'
      - 'tests/unit/test_build_filters.py'
      - 'tests/unit/cloudflare-route-tail.test.mjs'
      - '.github/workflows/cloudflare-quota-reductions.yml'
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: Seconds of natural traffic to observe (30–300)
        type: string
        default: '120'
      inspect_build_filters:
        description: Inspect backend build filters (independent of route diagnostics)
        type: boolean
        default: false
      apply_build_filters:
        description: Apply reviewed backend-only build watch paths
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-quota-reduction-operations
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests/unit -p test_build_filters.py
      - run: node --test tests/unit/cloudflare-route-tail.test.mjs
  inspect:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.repository == 'helbermoura2/Monitor-Global' && github.ref == 'refs/heads/main' && github.actor == 'helbermoura2'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe natural traffic, storing aggregate routes only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAIL_SECONDS: ${{ inputs.capture_seconds }}
        run: node tools/cloudflare-route-tail.mjs
      - name: Inspect or apply backend build filters
        if: always() && (inputs.inspect_build_filters || inputs.apply_build_filters)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLY_BUILD_FILTERS: ${{ inputs.apply_build_filters }}
        run: python tools/cloudflare-build-filters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-quota-reductions
          path: audit-results/*.json
          retention-days: 14

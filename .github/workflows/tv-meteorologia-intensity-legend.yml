name: TV meteorology stages 07 and 08 intensity and legend
on:
  push:
    branches: [feat/tv-meteorologia-avancada]
    paths:
      - '.github/workflows/tv-meteorologia-intensity-legend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate intensity and dynamic legend
        working-directory: android-tv
        run: ./gradlew --no-daemon -Pandroid.useAndroidX=true -PnativeMapChecks :app:testDebugUnitTest --tests 'top.monitorglobal.tv.RadarLegendTest'

name: Telegram Imperial Bronze exact PNG preview
on:
  pull_request:
    paths:
      - 'worker/telegram-imperial-preview.mjs'
      - 'worker/telegram-imperial-auto-repost.mjs'
      - 'assets/telegram/m6/imperial-bronze-preview-2026-11-16-m6-6.png'
      - 'tests/unit/telegram-imperial-auto-repost.test.mjs'
      - 'monitor-global-worker-7_7_0.js'
      - 'js/telegram-history.js'
      - 'tests/unit/telegram-imperial-preview.test.mjs'
      - 'tests/unit/admin-security.test.mjs'
      - '.github/workflows/telegram-imperial-preview.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact PNG and at-most-once send
        run: node --test tests/unit/telegram-imperial-preview.test.mjs tests/unit/telegram-imperial-auto-repost.test.mjs tests/unit/admin-security.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public exact-art repository import
        run: python -m unittest discover -s tests/unit -p test_import_imperial_preview.py
      - name: Bundle current Worker
        run: npm run worker:bundle

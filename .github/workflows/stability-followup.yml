name: Stability follow-up
on:
  pull_request:
    paths:
      - 'tests/cinema-materials.spec.js'
      - 'tests/tsunami-presentation.spec.js'
      - 'tests/wave-final-hold.spec.js'
      - 'tests/helpers/paused-clock.cjs'
      - '.github/workflows/stability-followup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stability-followup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Repeat formerly unstable scenarios three times
        env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/stability.json
        run: >-
          npx playwright test tests/cinema-materials.spec.js tests/tsunami-presentation.spec.js tests/wave-final-hold.spec.js
          --grep 'M5.9 treme|late bulletin starts|manual chase stops at its display deadline 4.1'
          --workers=1 --repeat-each=3 --retries=0 --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-followup-diagnostics
          path: |
            test-results/
            test-diagnostics/
          retention-days: 7
          if-no-files-found: ignore


name: Meteo Center — diagnóstico LightningCast
on:
  push:
    branches: [feat/mobile-meteo-center-inpe-radar]
    paths: ['tools/probe-lightningcast.py','.github/workflows/mobile-lightningcast-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar metadados e geometria candidata sem publicação
        run: python3 tools/probe-lightningcast.py

name: TV satellite freshness comparison
on:
  push:
    branches: [fix/tv-satellite-freshness]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Compare advertised infrared frame times from public providers
        run: python tools/probe-tv-satellite-freshness.py

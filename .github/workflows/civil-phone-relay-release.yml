name: Deploy paired Cell Broadcast relay provenance
on:
  push:
    branches: [main]
    paths:
      - 'worker/civil-phone-relay.mjs'
      - '.github/workflows/civil-phone-relay-release.yml'
  pull_request:
    paths:
      - 'worker/civil-phone-relay.mjs'
      - 'tests/unit/civil-phone-relay.test.mjs'
      - '.github/workflows/civil-phone-relay-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Dedicated deployment queue: do not let unrelated mobile CI cancel a pending relay rollout.
  group: cloudflare-civil-phone-relay-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/civil-phone-relay.mjs
      - run: node --test tests/unit/civil-phone-relay.test.mjs
  publish-provenance:
    needs: validate-provenance
    if: github.repository == 'helbermoura2/Monitor-Global' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authenticated first/second sender handling
        run: |
          node --check worker/civil-phone-relay.mjs
          node --test tests/unit/civil-phone-relay.test.mjs
          python -m unittest discover -s tests/unit -p test_cloudflare_maintenance.py
      - name: Build reviewed Worker bundle without changing bindings
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run worker:test
          npm run worker:bundle
      - name: Deploy additive provenance fields to existing Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAINTENANCE_MODE: deploy
        run: python tools/cloudflare-worker-maintenance.py

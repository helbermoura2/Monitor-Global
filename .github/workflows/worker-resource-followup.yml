name: Worker resource follow-up
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-resource-followup.yml'
  pull_request:
    paths:
      - '.github/workflows/worker-resource-followup.yml'
      - 'tools/resource-followup-summary.mjs'
      - 'tests/unit/resource-followup-summary.test.mjs'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-resource-follow-up
  cancel-in-progress: false
env:
  OBSERVATION_UNTIL_UTC: '2026-11-01T04:16:01.000Z'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
        run: node --test tests/unit/cloudflare-route-tail.test.mjs tests/unit/resource-followup-summary.test.mjs
  window:
    if: github.repository == 'helbermoura2/Monitor-Global' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          end = datetime.fromisoformat(os.environ['OBSERVATION_UNTIL_UTC'].replace('Z', '+00:00'))
          active = datetime.now(timezone.utc) < end
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Janela limitada até ' + end.isoformat() + '. Coletas de cinco minutos a cada dez minutos; não é cobertura contínua.\n')
          PY
  observe:
    needs: [checks, window]
    if: needs.window.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Observe five minutes of natural traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAIL_SECONDS: '300'
        run: node tools/cloudflare-route-tail.mjs
      - name: Classify observed resource outcomes without claiming resolution
        if: always()
        run: node tools/resource-followup-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-resource-observation
          path: audit-results/route-tail.json
          retention-days: 14
          if-no-files-found: warn
  availability-configuration:
    if: github.repository == 'helbermoura2/Monitor-Global' && github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only; do not send Telegram
        env:
          UPTIME_TELEGRAM_BOT_TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
          UPTIME_TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          names = ('UPTIME_TELEGRAM_BOT_TOKEN', 'UPTIME_TELEGRAM_CHAT_ID')
          lines = ['## Alarme privado: presença dos Secrets', '', 'Nenhuma mensagem enviada. Presença não comprova validade ou entrega.', '']
          for name in names:
              lines.append('- ' + name + ': ' + ('presente' if os.environ.get(name) else 'ausente'))
          lines.append('')
          lines.append('Pronto para conferir entrega: ' + ('sim' if all(os.environ.get(n) for n in names) else 'não; depende do cadastro privado pelo dono'))
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(report)
          PY
  baseline:
    needs: [checks, window]
    if: github.event_name == 'push' && needs.window.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/unit -p test_free_quota_audit.py
      - name: Read current analytics once without changing services
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare-free-quota-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-followup-baseline
          path: |
            audit-results/cloudflare-free-quota.json
            audit-results/cloudflare-free-quota.md
          retention-days: 14
  stop-expired-window:
    needs: window
    if: needs.window.outputs.active == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disable only this temporary diagnostic workflow after expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/worker-resource-followup.yml/disable'
          req = urllib.request.Request(url, method='PUT', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=20) as r:
              if r.status != 204:
                  raise SystemExit('Unexpected shutdown status')
          print('Janela encerrada; somente este workflow temporário foi desativado.')
          PY


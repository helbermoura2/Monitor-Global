name: Worker resource follow-up
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/worker-resource-followup.yml'
      - 'tools/resource-followup-summary.mjs'
      - 'tests/unit/resource-followup-summary.test.mjs'
permissions:
  contents: read
concurrency:
  group: worker-resource-follow-up
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
        run: node --test tests/unit/cloudflare-route-tail.test.mjs tests/unit/resource-followup-summary.test.mjs
  observe:
    needs: checks
    if: github.repository == 'helbermoura2/Monitor-Global' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Observe six five-minute natural-traffic windows over one hour
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAIL_SECONDS: '300'
        run: |
          mkdir -p audit-results/cpu-windows
          for i in 1 2 3 4 5 6; do
            echo "::group::CPU observation window $i/6"
            node tools/cloudflare-route-tail.mjs
            node tools/resource-followup-summary.mjs
            cp audit-results/route-tail.json "audit-results/cpu-windows/window-$i.json"
            echo "::endgroup::"
            if [ "$i" -lt 6 ]; then sleep 300; fi
          done
      - name: Upload sanitized route summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-cpu-observation-six-windows
          path: audit-results/cpu-windows/*.json
          retention-days: 14
          if-no-files-found: warn

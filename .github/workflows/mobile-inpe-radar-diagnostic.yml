name: Meteo Center — diagnóstico INPE
on:
  push:
    branches: [feat/mobile-meteo-center-inpe-radar]
    paths: ['.github/workflows/mobile-inpe-radar-diagnostic.yml','tools/probe-inpe-radar.mjs','tools/probe-inpe-netcdf.py','tools/probe-inpe-national.mjs','android-mobile/app/src/main/assets/inpe-radar-catalog.mjs','tests/unit/inpe-radar-catalog.test.mjs','android-mobile/app/src/main/assets/inpe-radar-grid.mjs','tests/unit/inpe-radar-grid.test.mjs','tools/check-inpe-grid.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar adaptador STAC
        run: node --test tests/unit/inpe-radar-catalog.test.mjs tests/unit/inpe-radar-grid.test.mjs
      - name: Consultar observações históricas conhecidas
        id: archive
        continue-on-error: true
        run: node tools/probe-inpe-radar.mjs --archive
      - name: Consultar observações recentes e validar PNG
        id: recent
        continue-on-error: true
        run: node tools/probe-inpe-radar.mjs
      - name: Preparar leitor científico NetCDF
        run: |
          python3 -m venv /tmp/argos-radar
          /tmp/argos-radar/bin/pip install --quiet netCDF4 numpy pillow
      - name: Buscar produtos NetCDF nas cinco regiões
        id: national
        continue-on-error: true
        run: node tools/probe-inpe-national.mjs
      - name: Conferir geometria real e níveis de altitude
        run: |
          missing=0
          for product in cappi3km cappi15l; do
            sample="/tmp/argos-inpe-$product.json"
            if [ ! -s "$sample" ]; then
              echo "::warning::Produto $product não encontrado nas amostras consultadas; validação pendente."
              missing=1
              continue
            fi
            /tmp/argos-radar/bin/python tools/probe-inpe-netcdf.py "$sample"
          done
          test "$missing" = 0
      - name: Validar renderização das grades reais em Web Mercator
        run: |
          node tools/check-inpe-grid.mjs /tmp/argos-grid-cappi3km-3000.json /tmp/argos-grid-cappi15l-3000.json /tmp/argos-grid-cappi15l-16000.json
      - name: Exigir confirmação das duas consultas
        if: always()
        env:
          ARCHIVE: ${{ steps.archive.outcome }}
          RECENT: ${{ steps.recent.outcome }}
        run: |
          echo "Histórico: $ARCHIVE | Recente: $RECENT"
          test "$ARCHIVE" = success && test "$RECENT" = success

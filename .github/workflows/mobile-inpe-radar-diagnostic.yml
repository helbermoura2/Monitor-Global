name: Meteo Center — diagnóstico INPE
on:
  push:
    branches: [feat/mobile-meteo-center-inpe-radar]
    paths: ['.github/workflows/mobile-inpe-radar-diagnostic.yml','tools/probe-inpe-radar.mjs','tools/probe-inpe-netcdf.py','android-mobile/app/src/main/assets/inpe-radar-catalog.mjs','tests/unit/inpe-radar-catalog.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar adaptador STAC
        run: node --test tests/unit/inpe-radar-catalog.test.mjs
      - name: Consultar observações históricas conhecidas
        id: archive
        continue-on-error: true
        run: node tools/probe-inpe-radar.mjs --archive
      - name: Consultar observações recentes e validar PNG
        id: recent
        continue-on-error: true
        run: node tools/probe-inpe-radar.mjs
      - name: Preparar leitor científico NetCDF
        run: |
          python3 -m venv /tmp/argos-radar
          /tmp/argos-radar/bin/pip install --quiet netCDF4 numpy pillow
      - name: Conferir geometria real e níveis de altitude
        run: /tmp/argos-radar/bin/python tools/probe-inpe-netcdf.py /tmp/argos-inpe-sample.json
      - name: Exigir confirmação das duas consultas
        if: always()
        env:
          ARCHIVE: ${{ steps.archive.outcome }}
          RECENT: ${{ steps.recent.outcome }}
        run: |
          echo "Histórico: $ARCHIVE | Recente: $RECENT"
          test "$ARCHIVE" = success && test "$RECENT" = success

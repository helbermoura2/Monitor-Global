name: Cloudflare Worker maintenance
on:
  # One-time, explicitly approved rollout from main. Future AI commits do not auto-deploy.
  push:
    branches: [main]
    paths: ['android-tv/AI_DEPLOY_REQUEST_20261108.txt', 'android-tv/MARKET_STATUS_DEPLOY_REQUEST_20261113.txt']
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect metrics, deploy the reviewed bundle, or verify without redeploying
        type: choice
        options: [inspect, deploy, verify]
        default: inspect
permissions:
  contents: read
concurrency:
  group: cloudflare-black-sky-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.actor == 'helbermoura2')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate maintenance safeguards
        run: python -m unittest discover -s tests/unit -p test_cloudflare_maintenance.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate modular Worker services and delivery safeguards
        run: npm run worker:test
      - name: Build the current reviewed source before deployment
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run worker:bundle
      - name: Inspect or update the existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAINTENANCE_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
        run: python tools/cloudflare-worker-maintenance.py


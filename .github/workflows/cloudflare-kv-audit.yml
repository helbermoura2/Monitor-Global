name: Audit Cloudflare KV consumption
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-kv-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read metrics without touching KV data or deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare-kv-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: kv-consumption-audit
          path: audit-results/cloudflare-kv-audit.json
          retention-days: 7

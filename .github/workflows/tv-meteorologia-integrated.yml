name: TV meteorology stage 19 integrated validation
on:
  push:
    branches: [feat/tv-meteorologia-avancada]
    paths:
      - '.github/workflows/tv-meteorologia-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real observations and forecast; create separate known-motion test controls
        run: |
          python -m pip install --disable-pip-version-check netCDF4 numpy
          curl --fail --silent --show-error --max-time 35 --max-filesize 12582912 'https://data.inpe.br/bdc/data/br-weather-radar-cappi/decea/picocouto/cappi/cappi3km_nc/2026/11/cappi3km_202611252200.nc' -o /tmp/real-old.nc
          curl --fail --silent --show-error --max-time 35 --max-filesize 12582912 'https://data.inpe.br/bdc/data/br-weather-radar-cappi/decea/picocouto/cappi/cappi3km_nc/2026/11/cappi3km_202611252210.nc' -o /tmp/real-new.nc
          echo 'cd0904eeb2ac2604595f65bfbc57ba1759bebdf360d5581d28be20be7d121416  /tmp/real-new.nc' | sha256sum -c -
          echo "ARGOS_FORECAST_TIME=$(($(date +%s)*1000))" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --max-time 35 --max-filesize 262144 'https://api.open-meteo.com/v1/forecast?latitude=-24.5,-24.5,-24.5,-23.5,-23.5,-23.5,-22.5,-22.5,-22.5&longitude=-48,-46.5,-45,-48,-46.5,-45,-48,-46.5,-45&hourly=precipitation&models=ecmwf_ifs025&timezone=GMT&timeformat=unixtime&forecast_hours=7' -o /tmp/forecast.json
          python - <<'PY'
          import numpy as np
          from netCDF4 import Dataset
          a=np.random.default_rng(42).uniform(20,50,(500,500)).astype('f4')
          b=np.full((500,500),-9999.9,dtype='f4')
          b[:-3,6:]=a[3:,:-6]
          for name,grid in [('old',a),('new',b)]:
              with Dataset('/tmp/shift-'+name+'.nc','w',format='NETCDF3_64BIT_OFFSET') as d:
                  for key,n in [('time',1),('lat',500),('lon',500)]:d.createDimension(key,n)
                  d.createVariable('lat','f8',('lat',))[:]=np.linspace(-25,-20,500)
                  d.createVariable('lon','f8',('lon',))[:]=np.linspace(-48,-43,500)
                  d.createVariable('dbz','f4',('time','lat','lon'),fill_value=-9999.9)[0,:,:]=grid
          PY
          echo 'ARGOS_REAL_OLD=/tmp/real-old.nc' >> "$GITHUB_ENV"
          echo 'ARGOS_REAL_NEW=/tmp/real-new.nc' >> "$GITHUB_ENV"
          echo 'ARGOS_SHIFT_OLD=/tmp/shift-old.nc' >> "$GITHUB_ENV"
          echo 'ARGOS_SHIFT_NEW=/tmp/shift-new.nc' >> "$GITHUB_ENV"
          echo 'ARGOS_FORECAST_FIXTURE=/tmp/forecast.json' >> "$GITHUB_ENV"
          echo 'ARGOS_CAPPI_TEST_FILE=/tmp/real-new.nc' >> "$GITHUB_ENV"
          echo 'ARGOS_REQUIRE_WEATHER_FIXTURES=1' >> "$GITHUB_ENV"
      - name: Verify shared seismic and tsunami invariants
        run: |
          node --test tests/unit/tv-daily-totals.test.mjs tests/unit/tv-history.test.mjs
          node tools/tsunami-lifecycle-fixtures.mjs --check
      - name: Verify actual infrared source image
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python .github/scripts/probe-tv-satellite.py
      - name: Compile release candidate and run all Android TV tests
        working-directory: android-tv
        run: ./gradlew --no-daemon -PnativeMapChecks -Pandroid.useAndroidX=true :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
      - name: Enforce weather tests ran without skips
        run: |
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('android-tv/app/build/test-results/testReleaseUnitTest')
          for name in ['RadarMapRenderTest','RadarLegendTest','RadarTimelineTest','WeatherPredictionTest','WeatherPredictionMapTest','WeatherMapNewsStripTest']:
              files=list(root.glob('TEST-*.'+name+'.xml'))
              assert len(files)==1, 'Missing test report: '+name
              r=ET.parse(files[0]).getroot()
              assert int(r.attrib['tests'])>0 and int(r.attrib.get('skipped','0'))==0 and int(r.attrib.get('failures','0'))==0 and int(r.attrib.get('errors','0'))==0, name+' did not fully pass'
              print(name,r.attrib['tests'],'passed')
          PY
      - name: Verify existing distribution protection
        run: |
          python -m unittest discover -s android-tv/tests/python
          python android-tv/tools/check-distribution.py "$ANDROID_HOME/build-tools/35.0.0"
      - name: Save test reports on success or failure (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-weather-integrated-reports
          path: |
            android-tv/app/build/test-results/testReleaseUnitTest/
            android-tv/app/build/reports/lint-results-release.xml
          retention-days: 7

name: Refresh GOES-19 lightning observations
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goes-19-lightning
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install netCDF4==1.7.4
      - run: python tools/update-goes-lightning.py
      - name: Publish observed lightning snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/goes-19-lightning.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh GOES-19 lightning observation'
          git pull --rebase origin main
          git push origin HEAD:main

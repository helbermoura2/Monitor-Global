name: TV weather visual correction
on:
  push:
    branches: [fix/tv-weather-visual-layout]
    paths: ['.github/workflows/tv-weather-visual-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate real image dimensions, radar legend and newsroom strip
        working-directory: android-tv
        run: ./gradlew --no-daemon -PnativeMapChecks -Pandroid.useAndroidX=true :app:testDebugUnitTest --tests 'top.monitorglobal.tv.WeatherViewerLayoutTest' --tests 'top.monitorglobal.tv.RadarLegendTest' --tests 'top.monitorglobal.tv.WeatherMapNewsStripTest' --tests 'top.monitorglobal.tv.WeatherSatelliteTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-layout-review
          path: /tmp/argos-weather-layout-*.png
          retention-days: 7

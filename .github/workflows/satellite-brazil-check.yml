name: Brazil satellite checks
on:
  push:
    branches: [feat/satellite-brazil]
    paths:
      - '.github/workflows/satellite-brazil-check.yml'
      - 'tools/probe-brazil-satellite.py'
      - 'js/brazil-satellite*'
      - 'tests/brazil-satellite*'
  pull_request:
    paths:
      - 'js/brazil-satellite*'
      - 'tests/brazil-satellite*'
permissions:
  contents: read
concurrency:
  group: brazil-satellite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Confirm real imagery and source timestamp
        run: python tools/probe-brazil-satellite.py

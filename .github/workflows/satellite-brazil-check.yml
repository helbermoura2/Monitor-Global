name: Brazil satellite checks
on:
  push:
    branches: [feat/satellite-brazil]
    paths:
      - '.github/workflows/satellite-brazil-check.yml'
      - 'tools/probe-brazil-satellite.py'
      - 'js/brazil-satellite*'
      - 'tests/brazil-satellite*'
  pull_request:
    paths:
      - 'js/brazil-satellite*'
      - 'tests/brazil-satellite*'
permissions:
  contents: read
concurrency:
  group: brazil-satellite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Confirm real imagery and source timestamp
        run: python tools/probe-brazil-satellite.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify satellite time and geometry rules
        run: node --test tests/unit/brazil-satellite.test.cjs
      - name: Render clipped Brazil imagery and verify playback lifecycle
        run: node tools/check-brazil-satellite-browser.cjs
      - name: Export review images
        if: always()
        run: |
          python - <<'PYIMAGE'
          from PIL import Image
          from pathlib import Path
          import io,base64
          for name in ['brazil-satellite-browser','brazil-satellite-globe']:
              p=Path('/tmp/'+name+'.png')
              if not p.exists(): continue
              image=Image.open(p).convert('RGB');image.thumbnail((850,750));out=io.BytesIO();image.save(out,format='JPEG',quality=75)
              print(name+'_BASE64 '+base64.b64encode(out.getvalue()).decode())
          PYIMAGE

name: Audit Durable Object requests and storage
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # Previous UTC day is complete; analytics never invoke objects.
permissions:
  contents: read
concurrency:
  group: cloudflare-durable-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate consumption aggregation
        run: python -m unittest discover -s tests/unit -p test_cloudflare_durable_audit.py
      - name: Read aggregate analytics without invoking objects or deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare-durable-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-requests-audit
          path: audit-results/durable-requests.json
          retention-days: 7

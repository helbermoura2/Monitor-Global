name: Android mobile preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-mobile/**'
      - '.github/workflows/android-mobile-preview.yml'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/Alert.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/AlertCodec.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/AlertPairing.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/MapFrame.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/BrDates.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/CountryFlag.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/RainForecast.java'
      - 'android-tv/app/src/main/java/top/monitorglobal/tv/WeatherForecast.java'
  push:
    branches: [main]
    paths:
      - 'android-mobile/**'
      - '.github/workflows/android-mobile-preview.yml'
permissions:
  contents: read
concurrency:
  group: android-mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Reuse development signing identity for preview builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/.android/debug.keystore
            ~/.android/debug.keystore
          key: monitor-global-mobile-debug-key-v2
      - name: Verify mobile push delivery rules
        run: node --test tests/unit/mobile-push.test.mjs android-mobile/tools/phone-rain-model.test.cjs tests/unit/rainbow-products.test.mjs
      - name: Build and inspect phone APKs
        working-directory: android-mobile
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease :app:testDebugUnitTest
      - name: Verify native phone navigation and lifecycle
        working-directory: android-mobile
        run: ./gradlew --no-daemon -PphoneUiChecks :app:testDebugUnitTest
      - name: Inspect preview update signing identity
        run: |
          android-mobile/gradlew --no-daemon :app:signingReport
          python - <<'PY'
          import pathlib,subprocess,urllib.request,os,re,json
          previous=pathlib.Path('/tmp/phone-previous.apk')
          with urllib.request.urlopen('https://github.com/helbermoura2/Monitor-Global/releases/download/mobile-preview/monitor-global-mobile-preview.apk',timeout=30) as r: previous.write_bytes(r.read(20*1024*1024))
          tool=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0/apksigner'
          def signer(p):
              result=subprocess.check_output([str(tool),'verify','--print-certs',str(p)],text=True)
              return re.search(r'Signer #1 certificate SHA-256 digest: (\w+)',result).group(1)
          old,new=signer(previous),signer('android-mobile/app/build/outputs/apk/debug/app-debug.apk')
          print(json.dumps({'previousSigner':old,'newSigner':new,'sameSigner':old==new}))
          if old != new and old != '1b7520e25838b9050e9a26203f70c298927e4dbe3d3005c54e6118d0c7a13fce':
              raise SystemExit('Preview signing identity changed unexpectedly; refusing publication.')
          PY
      - name: Check packaged phone identity and permissions
        run: python android-mobile/tools/check-preview-apk.py "$ANDROID_HOME/build-tools/35.0.0/aapt" android-mobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser check dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Render the packaged map and open event details
        run: node android-mobile/tools/check-phone-map-browser.cjs --apk android-mobile/app/build/outputs/apk/debug/app-debug.apk
      - name: Render packaged precipitation timeline and verify camera and lifecycle
        run: node android-mobile/tools/check-phone-rain-browser.cjs --apk android-mobile/app/build/outputs/apk/debug/app-debug.apk --live-proof
      - name: Export map rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-global-mobile-map-check
          path: |
            android-mobile/app/build/reports/map-browser
            android-mobile/app/build/reports/rain-browser
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-global-mobile-preview
          path: android-mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Export native phone screens
        uses: actions/upload-artifact@v4
        with:
          name: monitor-global-mobile-screens
          path: /tmp/monitor-phone-*.png
          if-no-files-found: warn
          retention-days: 14
  rain-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-black-sky-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify shared Worker service safeguards
        run: npm run worker:test
      - name: Check whether the additive rain service changed
        id: service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet HEAD^ HEAD -- rainbow-products-worker.mjs; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the reviewed Worker bundle
        if: steps.service.outputs.deploy == 'true'
        run: npm run worker:bundle
      - name: Publish additive forecast route preserving bindings and schedules
        if: steps.service.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAINTENANCE_MODE: deploy
        run: python tools/cloudflare-worker-maintenance.py
      - name: Verify live forecast map before publishing the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python android-mobile/tools/probe-phone-rain.py
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'helbermoura2/Monitor-Global'
    needs: [build, rain-service]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monitor-global-mobile-preview
          path: preview-apk
      - name: Publish explicitly marked Android testing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib, shutil
          source=pathlib.Path('preview-apk/app-debug.apk')
          target=pathlib.Path('preview-apk/monitor-global-mobile-preview.apk')
          shutil.copyfile(source,target)
          import re
          version=re.search(r"versionName '([^']+)'",pathlib.Path('android-mobile/app/build.gradle').read_text()).group(1)
          shutil.copyfile(source,pathlib.Path('preview-apk')/('monitor-global-mobile-'+version+'.apk'))
          notes=pathlib.Path('android-mobile/PREVIEW_RELEASE.md').read_text()
          pathlib.Path('preview-notes.md').write_text(notes)
          PY
          if gh release view mobile-preview >/dev/null 2>&1; then
            gh release edit mobile-preview --prerelease --title 'Monitor Global Celular · versão de teste' --notes-file preview-notes.md
          else
            gh release create mobile-preview --target "$GITHUB_SHA" --prerelease --title 'Monitor Global Celular · versão de teste' --notes-file preview-notes.md
          fi
          gh release upload mobile-preview preview-apk/monitor-global-mobile*.apk --clobber

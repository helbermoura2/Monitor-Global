name: Audit Cloudflare account consumption and alert options
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/cloudflare-account-audit.py
      - tests/unit/test_cloudflare_account_audit.py
      - .github/workflows/cloudflare-account-audit.yml
permissions:
  contents: read
concurrency:
  group: cloudflare-account-audit
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/unit -p test_cloudflare_account_audit.py
  audit:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'helbermoura2/Monitor-Global' && github.ref == 'refs/heads/main' && github.actor == 'helbermoura2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check report redaction
        run: python -m unittest discover -s tests/unit -p test_cloudflare_account_audit.py
      - name: Read aggregate consumption, subscriptions and notification capabilities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare-account-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-account-audit
          path: audit-results/cloudflare-account-audit.json
          retention-days: 7

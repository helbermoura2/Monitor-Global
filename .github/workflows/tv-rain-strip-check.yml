name: TV compact rain strip
on:
  push:
    branches: [feat/tv-rain-strip]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Render compact rain notices and verify delivery lifecycle
        working-directory: android-tv
        run: >-
          ./gradlew --no-daemon -PnativeMapChecks -Pandroid.useAndroidX=true :app:testReleaseUnitTest
          --tests top.monitorglobal.tv.RainStripTest
          --tests top.monitorglobal.tv.WeatherCardsDesignTest
          --tests top.monitorglobal.tv.StormPreviewTest
          --tests top.monitorglobal.tv.RainMonitorTest
          --tests top.monitorglobal.tv.RainOverlayTest
          --tests top.monitorglobal.tv.HourlyWeatherTest
          --tests top.monitorglobal.tv.WeatherServicePulseTest
      - name: Export real Android layout proof
        if: always()
        run: |
          python - <<'PY'
          import pathlib,re
          for p in pathlib.Path('android-tv/app/build/test-results').glob('**/TEST-*RainStripTest.xml'):
              for name,image in re.findall(r'RAIN_STRIP_PREVIEW_(\w+) ([A-Za-z0-9+/=]+)',p.read_text()):
                  print('RAIN_STRIP_PREVIEW_'+name+' '+image)
          PY

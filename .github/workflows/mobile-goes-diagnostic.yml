name: Meteo Center — diagnóstico satélite GOES
on:
  push:
    branches: [feat/mobile-meteo-center-inpe-radar]
    paths: ['tools/probe-mobile-goes.py','tools/goes-water-vapor-reader.mjs','tools/check-goes-water-vapor.mjs','tools/goes-water-vapor-browser-worker.mjs','tools/check-goes-water-vapor-browser.mjs','android-mobile/app/src/main/assets/phone-goes-grid.mjs','.github/workflows/mobile-goes-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar verificação científica de imagens
        run: |
          python3 -m venv /tmp/argos-goes
          /tmp/argos-goes/bin/pip install --quiet pillow netCDF4 numpy pyproj
      - name: Verificar catálogo, horários, imagens e CORS GOES
        run: /tmp/argos-goes/bin/python tools/probe-mobile-goes.py
      - name: Comparar recorte GOES com referência científica
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund h5wasm@0.10.3 esbuild@0.25.12
          node tools/check-goes-water-vapor.mjs
      - name: Validar leitor de vapor GOES no navegador com WebAssembly
        if: ${{ !cancelled() }}
        run: node tools/check-goes-water-vapor-browser.mjs
      - name: Exigir dados recentes para uso operacional
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          path=pathlib.Path('/tmp/argos-goes-freshness.json')
          if not path.exists():
              sys.exit('Disponibilidade recente não confirmada: sem metadados válidos')
          result=json.loads(path.read_text())
          print(json.dumps(result,ensure_ascii=False))
          if result.get('fresh') is not True or set(result.get('bands',[]))!={'Band08','Band09','Band10'}:
              sys.exit('Fonte INPE defasada ou incompleta: validação operacional pendente, mesmo se o leitor científico passar')
          PY

name: Smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/smoke-test.yml'
      - 'tests/**'
      - 'tools/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vendor/**'
      - 'worker/**'
      - 'android-tv/**'
      - '*.js'
      - '*.mjs'
      - '*.html'
      - 'package*.json'
  schedule:
    - cron: '0 9 * * *' # Uma vez por dia, às 06h de Brasília (UTC-3).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Split the complete suite, preserving every scenario. Two browser workers
    # fit the runner's two CPUs; shards prevent the old 65-minute cancellation.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi

      - name: Validar grades oficiais compactadas
        if: matrix.shard == '1/3'
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/unit.json
        run: |
          python -m unittest discover -s tests/unit -p test_official_shaking.py
          python -m unittest discover -s tests/unit -p test_cemaden_alerts.py

      - name: Validar lógica local, cotas e dados simulados
        if: matrix.shard == '1/3'
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/unit.json
        run: |
          mkdir -p test-logs
          set -eo pipefail
          {
            node --test tests/unit/*.test.cjs tests/unit/*.test.mjs
            for check in tests/unit/*-check.cjs tests/unit/*-check.mjs; do
              node "$check"
            done
          } 2>&1 | tee test-logs/unit-checks.log

      - name: Rodar testes de fumaça
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/suite.json
        run: npx playwright test --shard=${{ matrix.shard }} --workers=2 --reporter=line,json,html

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

      - name: Resumir falhas e preservar diagnóstico
        if: always()
        run: node tools/test-summary.cjs
      - name: Anexar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: |
            test-logs/
            test-diagnostics/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  card-visibility:
    runs-on: ubuntu-latest
    # Bumped 7->15min -- same reason as the playwright job above: storm/wind/
    # cyclone specs here used to crash fast on the clock/tile-retry race
    # (issue #327, fixed in PR #336) and now run their real full duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verificar visibilidade das cenas e helpers compartilhados
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/visibility.json
        run: npx playwright test tests/painel-fx-shared-layer.spec.js tests/cinematic-card.spec.js --grep 'rajadas contínuas|letras ao vento|primeiro quadro|todos os efeitos|falha do vídeo' --workers=1 --reporter=line,json

      - name: Validar tempestades e capturar prévias
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/storms.json
        run: npx playwright test tests/storm-cinema.spec.js tests/storm-lightning.spec.js --workers=1 --reporter=line,json
      - name: Publicar prévias das tempestades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storm-previews
          path: /tmp/storm-scene-*.png
          retention-days: 7
      - name: Validar rajadas e capturar prévias
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/wind.json
        run: npx playwright test tests/wind-cinema.spec.js --workers=1 --reporter=line,json
      - name: Publicar prévias das rajadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-previews
          path: /tmp/wind-scene-*.png
          retention-days: 7
      - name: Validar ciclones e capturar prévias
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/cyclones.json
        run: npx playwright test tests/cyclone-cinema.spec.js --workers=1 --reporter=line,json
      - name: Publicar prévias dos ciclones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-previews
          path: /tmp/cyclone-*.png
          retention-days: 7

      - name: Resumir falhas e preservar diagnóstico
        if: always()
        run: node tools/test-summary.cjs
      - name: Anexar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}
          path: |
            test-logs/
            test-diagnostics/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  weather-materials:
    runs-on: ubuntu-latest
    # Bumped 10->20->28min -- same reason as above: tornado-cinema and
    # tsunami-inundation here used to crash fast on the clock/tile-retry
    # race (issue #327, fixed in PR #336) and now run their real full
    # duration, alongside the other 10 specs in this job's single step.
    # 20min still got cancelled at 20min18s on the very next run -- not
    # enough margin, bumping further.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Validar materiais, volume e eventos simulados
        env:
          MONITOR_TEST_OFFLINE: "1"
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-diagnostics/materials.json
        run: npx playwright test tests/seismic-cinema.spec.js tests/seismic-camera-tour.spec.js tests/card-event-typography.spec.js tests/card-artifact-effects.spec.js tests/story-all-events.spec.js tests/advanced-weather.spec.js tests/storm-atmosphere.spec.js tests/real-effects-parity.spec.js tests/volcano-monitoring.spec.js tests/flood-continuity.spec.js tests/tsunami-inundation.spec.js tests/gale-material.spec.js tests/tornado-cinema.spec.js --workers=1 --reporter=line,json
      - name: Publicar prévias dos materiais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-weather-previews
          path: |
            /tmp/typography-*.png
            /tmp/advanced-weather-*.png
            /tmp/volcano-monitoring-*.png
            /tmp/flood-continuous-*.png
            /tmp/tsunami-inundation-*.png
            /tmp/tsunami-reserve-*.png
            /tmp/gale-material-*.png
            /tmp/wind-missing-letters-*.png
            /tmp/tornado-*.png
          retention-days: 7
      - name: Resumir falhas e preservar diagnóstico
        if: always()
        run: node tools/test-summary.cjs
      - name: Anexar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}
          path: |
            test-logs/
            test-diagnostics/
            test-results/
          if-no-files-found: ignore
          retention-days: 7


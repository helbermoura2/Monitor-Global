name: Smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Rodar a suíte inteira aqui duplicava quase tudo que card-visibility e
    # weather-materials já cobrem em jobs separados (storm/wind/cyclone/
    # advanced-weather/volcano/flood/tsunami/gale/tornado) -- inclusive
    # arquivos pesados como real-effects-parity.spec.js (testes de 2,5min).
    # Sharding por --shard=N/M não ajudava porque os arquivos mais lentos
    # (cinematic-card/cinema-materials) ficavam todos no mesmo shard por
    # ordem alfabética. Agora cada grupo lista exatamente os arquivos que
    # só rodam aqui, balanceados manualmente por peso conhecido.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group:
          # cinematic-card e cinema-materials iam juntos no mesmo grupo
          # (ordem alfabética do shard antigo); juntos, os testes de
          # "atmosfera continua visível"/"cena ocupa o cartão inteiro"
          # falhavam de forma consistente (não só uma vez) com canvas WebGL
          # em branco -- hipótese: os dois arquivos são os mais pesados em
          # canvas/WebGL da suíte inteira, e rodar ambos nos mesmos 2
          # workers acumula contextos WebGL até estourar o limite do
          # processo. Cada um agora tem seu próprio grupo/par de workers.
          - name: cinematic
            files: tests/cinematic-card.spec.js
          - name: materials
            files: tests/cinema-materials.spec.js
          - name: mid
            files: tests/election-results.spec.js tests/seismic-cinema.spec.js tests/regional-warning-cards.spec.js tests/regional-sources.spec.js tests/details-back.spec.js tests/auto-cycle.spec.js
          - name: light
            files: tests/cge-bulletins.spec.js tests/header-status.spec.js tests/rain-header.spec.js tests/smoke.spec.js tests/startup-cycle.spec.js tests/tsunami-wave-impact.spec.js tests/weather-panel.spec.js tests/world-weather-alerts.spec.js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi

      - name: Validar exposição populacional e reservas
        if: matrix.group.name == 'light'
        run: |
          node tests/unit/population-exposure-check.mjs
          node tests/unit/population-check.cjs
          node tests/unit/unified-cities-check.cjs
          node tests/unit/wave-camera-check.cjs
          node tests/unit/telegram-history-check.mjs
          node tests/unit/telegram-m6-emsc-check.mjs
          node tests/unit/daily-summary-design-check.mjs
          node tests/unit/source-proxy-check.mjs
          node tests/unit/official-weather-alerts-check.mjs
          node tests/unit/hazard-evidence-check.cjs
          node tests/unit/weather-evidence-check.cjs
          node tests/unit/rain-outlook-check.cjs
          node tests/unit/weather-observations-check.mjs
          node tests/unit/tse-results-check.mjs

      - name: Rodar testes de fumaça (${{ matrix.group.name }})
        run: npx playwright test ${{ matrix.group.files }}

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group.name }}
          path: playwright-report/
          retention-days: 7

  card-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verificar visibilidade das cenas e helpers compartilhados
        run: npx playwright test tests/painel-fx-shared-layer.spec.js tests/cinematic-card.spec.js --grep 'rajadas contínuas|letras ao vento|primeiro quadro|todos os efeitos|falha do vídeo' --workers=1

      - name: Validar tempestades e capturar prévias
        run: npx playwright test tests/storm-cinema.spec.js tests/storm-lightning.spec.js --workers=1
      - name: Publicar prévias das tempestades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storm-previews
          path: /tmp/storm-scene-*.png
          retention-days: 7
      - name: Validar rajadas e capturar prévias
        run: npx playwright test tests/wind-cinema.spec.js --workers=1
      - name: Publicar prévias das rajadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-previews
          path: /tmp/wind-scene-*.png
          retention-days: 7
      - name: Validar ciclones e capturar prévias
        run: npx playwright test tests/cyclone-cinema.spec.js --workers=1
      - name: Publicar prévias dos ciclones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-previews
          path: /tmp/cyclone-*.png
          retention-days: 7

  weather-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Validar materiais, volume e eventos reais
        run: npx playwright test tests/advanced-weather.spec.js tests/storm-atmosphere.spec.js tests/real-effects-parity.spec.js tests/volcano-monitoring.spec.js tests/flood-continuity.spec.js tests/tsunami-inundation.spec.js tests/gale-material.spec.js tests/tornado-cinema.spec.js --workers=1
      - name: Publicar prévias dos materiais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-weather-previews
          path: |
            /tmp/advanced-weather-*.png
            /tmp/volcano-monitoring-*.png
            /tmp/flood-continuous-*.png
            /tmp/tsunami-inundation-*.png
            /tmp/tsunami-reserve-*.png
            /tmp/gale-material-*.png
            /tmp/tornado-*.png
          retention-days: 7

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Preparar navegador do Playwright
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verificar site publicado
        env:
          PUBLIC_SITE_URL: https://monitorglobal.top
        run: npx playwright test tests/production-site.spec.js tests/production-election.spec.js


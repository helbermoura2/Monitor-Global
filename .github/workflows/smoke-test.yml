name: Smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Validar exposição populacional e reservas
        run: |
          node tests/unit/population-exposure-check.mjs
          node tests/unit/population-check.cjs
          node tests/unit/unified-cities-check.cjs
          node tests/unit/wave-camera-check.cjs
          node tests/unit/telegram-history-check.mjs
          node tests/unit/daily-summary-design-check.mjs
          node tests/unit/source-proxy-check.mjs
          node tests/unit/official-weather-alerts-check.mjs
          node tests/unit/hazard-evidence-check.cjs
          node tests/unit/weather-evidence-check.cjs
          node tests/unit/rain-outlook-check.cjs
          node tests/unit/weather-observations-check.mjs

      - name: Rodar testes de fumaça
        run: npx playwright test

      - name: Verificar site publicado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_SITE_URL: https://monitorglobal.top
        run: npx playwright test tests/production-site.spec.js

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  card-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verificar visibilidade das cenas e helpers compartilhados
        run: npx playwright test tests/painel-fx-shared-layer.spec.js tests/cinematic-card.spec.js --grep 'rajadas contínuas|todos os efeitos' --workers=1

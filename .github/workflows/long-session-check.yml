name: Long session regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/audio.js'
      - 'js/map-render-budget.js'
      - 'js/mapa.js'
      - 'js/rupture-shaking.js'
      - 'js/seismic-impact.js'
      - 'js/painel-e-lista.js'
      - 'js/geo-e-ciclone-utils.js'
      - 'js/ui-wiring-final.js'
      - 'worker/proxy-security.mjs'
      - 'tests/memory-security.spec.js'
      - 'tests/unit/map-spare-textures.test.cjs'
      - 'tests/unit/proxy-security.test.mjs'
      - 'js/tsunami-regional-model.js'
      - 'tests/tsunami-lifecycle.spec.js'
      - 'tools/tsunami-lifecycle-fixtures.mjs'
      - 'tests/unit/tsunami-lifecycle.test.mjs'
      - 'js/aftershock-sequence.js'
      - 'js/seismic-contour-labels.js'
      - 'js/data-freshness.js'
      - 'js/performance-diagnostics.js'
      - 'tests/local-performance-diagnostics.spec.js'
      - 'tests/unit/aftershock-sequence-memory.test.cjs'
      - 'tests/unit/seismic-contour-labels.test.cjs'
      - 'tests/unit/source-freshness.test.cjs'
      - 'tests/source-health.spec.js'
      - 'tests/neon-contour-labels.spec.js'
      - 'vendor/maplibre-gl.js'
      - 'worker/seismic-providers.mjs'
      - 'worker/http.mjs'
      - 'worker/tv-alerts.mjs'
      - 'worker/tv-snapshot.mjs'
      - 'worker/tv-map.mjs'
      - 'worker/tv-coastal-references.mjs'
      - 'tests/unit/tv-map.test.mjs'
      - 'js/quake-card-layout.js'
      - 'js/story-share.js'
      - 'quake-hd-fonts.mjs'
      - 'worker/image-rendering.mjs'
      - 'worker/tsunami-rendering.mjs'
      - 'tests/unit/quake-card-layout.test.mjs'
      - 'tests/unit/tsunami-image-patch.test.mjs'
      - 'tests/seismic-story-population.spec.js'
      - 'js/tsunami-priority.js'
      - 'js/tsunami-tornado.js'
      - 'js/presentation-limits.js'
      - 'tests/unit/tsunami-priority-policy.test.cjs'
      - 'tests/tsunami-globe-priority.spec.js'
      - 'worker/tv-context.mjs'
      - 'tests/unit/tv-context.test.mjs'
      - 'tests/unit/admin-security.test.mjs'
      - 'monitor-global-worker-7_7_0.js'
      - 'shared-source-cache.mjs'
      - 'js/app-recovery.js'
      - 'js/nucleo-estado.js'
      - 'js/vulcao.js'
      - 'js/tsunami-enchente.js'
      - 'js/event-products.js'
      - 'js/weather-warning-camera.js'
      - 'js/browser-request-budget.js'
      - 'js/cross-tab-public-requests.js'
      - 'js/population-exposure.js'
      - 'tests/cross-tab-public-requests.spec.js'
      - 'js/sismo-fontes.js'
      - 'js/furacoes-gdacs.js'
      - 'js/cemaden-risco.js'
      - 'js/performance-diagnostics.js'
      - 'tests/unit/*lifecycle*'
      - 'tests/unit/*budget*'
      - 'tests/unit/*memory*'
      - 'tests/unit/shared-source-delivery.test.cjs'
      - 'tests/unit/long-session-fixes.test.cjs'
      - 'tests/unit/earthquake-report-selection.test.cjs'
      - 'tools/catalog-report-memory-audit.cjs'
      - '.github/workflows/long-session-check.yml'
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local resource and source contracts
        env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
        run: |
          node --test tests/unit/cross-tab-public-requests.test.cjs tests/unit/rupture-shaking-client.test.cjs tests/unit/map-spare-textures.test.cjs tests/unit/proxy-security.test.mjs tests/unit/tv-map.test.mjs tests/unit/tsunami-lifecycle.test.mjs tests/unit/aftershock-sequence-memory.test.cjs tests/unit/seismic-contour-labels.test.cjs tests/unit/source-freshness.test.cjs tests/unit/quake-card-layout.test.mjs tests/unit/tsunami-image-patch.test.mjs tests/unit/telegram-population-reserve.test.mjs tests/unit/image-tsunami-status.test.mjs tests/unit/tsunami-priority-policy.test.cjs tests/unit/presentation-limits.test.cjs tests/unit/tv-context.test.mjs tests/unit/tv-alerts.test.mjs tests/unit/admin-security.test.mjs tests/unit/volcano-advisory-parser.test.cjs tests/unit/worker-modules.test.mjs tests/unit/earthquake-merge-budget.test.cjs tests/unit/source-session-budget.test.cjs tests/unit/weather-area-memory.test.cjs tests/unit/shared-source-delivery.test.cjs tests/unit/earthquake-report-selection.test.cjs tests/unit/audio-lifecycle.test.cjs tests/unit/event-products-budget.test.cjs tests/unit/long-session-fixes.test.cjs tests/unit/browser-request-budget.test.cjs tests/unit/event-insights.test.cjs tests/unit/world-view-audio.test.cjs tests/unit/mobile-cache-budget.test.cjs
          node tests/unit/audio-volume-check.cjs
          node tests/unit/population-check.cjs
          node tests/unit/unified-cities-check.cjs
      - name: Browser regressions, external services blocked
        env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
        run: |
          npx playwright test tests/cross-tab-public-requests.spec.js tests/memory-security.spec.js tests/tsunami-lifecycle.spec.js tests/tsunami-regional-system.spec.js tests/aftershock-sequence.spec.js tests/neon-contour-labels.spec.js tests/map-raster-retry.spec.js tests/app-recovery.spec.js tests/weather-warning-camera.spec.js tests/weather-warning-globe.spec.js tests/sequence-warning-regression.spec.js tests/local-performance-diagnostics.spec.js tests/source-health.spec.js tests/event-insights.spec.js tests/browser-request-budget.spec.js tests/world-view-audio.spec.js tests/seismic-story-population.spec.js tests/tsunami-painted-model1.spec.js --workers=2
          npx playwright test tests/tsunami-globe-priority.spec.js --grep "new tsunami interrupts|regional no-threat" --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: long-session-regression-failures
          path: test-results/
          retention-days: 7

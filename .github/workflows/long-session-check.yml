name: Long session regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/audio.js'
      - 'js/event-products.js'
      - 'js/weather-warning-camera.js'
      - 'js/browser-request-budget.js'
      - 'js/sismo-fontes.js'
      - 'js/furacoes-gdacs.js'
      - 'js/cemaden-risco.js'
      - 'js/performance-diagnostics.js'
      - 'tests/unit/*lifecycle*'
      - 'tests/unit/*budget*'
      - 'tests/unit/long-session-fixes.test.cjs'
      - 'tests/unit/earthquake-report-selection.test.cjs'
      - 'tools/catalog-report-memory-audit.cjs'
      - '.github/workflows/long-session-check.yml'
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local resource and source contracts
        env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
        run: |
          node --test tests/unit/earthquake-report-selection.test.cjs tests/unit/audio-lifecycle.test.cjs tests/unit/event-products-budget.test.cjs tests/unit/long-session-fixes.test.cjs tests/unit/browser-request-budget.test.cjs tests/unit/event-insights.test.cjs tests/unit/world-view-audio.test.cjs tests/unit/mobile-cache-budget.test.cjs
          node tests/unit/audio-volume-check.cjs
          node tests/unit/population-check.cjs
          node tests/unit/unified-cities-check.cjs
      - name: Browser regressions, external services blocked
        env:
          MONITOR_TEST_OFFLINE: '1'
          NODE_OPTIONS: --require ./tools/test-network-guard.cjs
        run: npx playwright test tests/weather-warning-camera.spec.js tests/weather-warning-globe.spec.js tests/sequence-warning-regression.spec.js tests/local-performance-diagnostics.spec.js tests/source-health.spec.js tests/event-insights.spec.js tests/browser-request-budget.spec.js tests/world-view-audio.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: long-session-regression-failures
          path: test-results/
          retention-days: 7

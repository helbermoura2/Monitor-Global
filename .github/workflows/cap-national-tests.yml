name: Test national CAP catalogue and severity labels
on:
  pull_request:
    paths:
      - 'tools/update-defesa-civil-sp.py'
      - 'tests/unit/test_defesa_civil_sp.py'
      - 'js/defesa-civil-cap-br.js'
      - 'js/brasil-hub.js'
      - '.github/workflows/cap-national-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Test CAP severity, cancellation, spatial scope and freshness
        run: python -m unittest discover -s tests/unit -p test_defesa_civil_sp.py
      - name: Static syntax of national browser integration
        run: |
          node --check js/defesa-civil-cap-br.js
          node --check js/brasil-hub.js

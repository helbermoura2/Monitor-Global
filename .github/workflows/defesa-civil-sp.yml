name: Refresh official CAP Severe / Extreme alerts for Brazil and São Paulo
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: defesa-civil-sp
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - run: python -m unittest discover -s tests/unit -p test_defesa_civil_sp.py
      - run: python tools/update-defesa-civil-sp.py
      - name: Publish official CAP snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/defesa-civil-sp.json data/defesa-civil-br.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh official Defesa Civil alerts for São Paulo'
          git pull --rebase origin main
          git push origin HEAD:main

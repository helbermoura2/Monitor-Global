name: Android TV preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv-preview.yml'
      - '.github/workflows/android-tv-release.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check shared tsunami lifecycle fixture
        run: node tools/tsunami-lifecycle-fixtures.mjs --check
      - name: Verify notification state machine
        run: |
          mkdir -p /tmp/tv-java-tests
          javac -d /tmp/tv-java-tests android-tv/app/src/main/java/top/monitorglobal/tv/Alert.java android-tv/app/src/main/java/top/monitorglobal/tv/AlertTracker.java android-tv/tests/AlertTrackerCheck.java
          java -cp /tmp/tv-java-tests top.monitorglobal.tv.AlertTrackerCheck
          javac -d /tmp/tv-java-tests android-tv/app/src/main/java/top/monitorglobal/tv/TrustPolicy.java android-tv/tests/TrustPolicyCheck.java
          java -cp /tmp/tv-java-tests top.monitorglobal.tv.TrustPolicyCheck
          javac -d /tmp/tv-java-tests android-tv/app/src/main/java/top/monitorglobal/tv/Alert.java android-tv/app/src/main/java/top/monitorglobal/tv/DemoAlerts.java android-tv/tests/DemoAlertsCheck.java
          java -cp /tmp/tv-java-tests top.monitorglobal.tv.DemoAlertsCheck
          javac -d /tmp/tv-java-tests android-tv/app/src/main/java/top/monitorglobal/tv/Alert.java android-tv/app/src/main/java/top/monitorglobal/tv/AlertPairing.java android-tv/app/src/main/java/top/monitorglobal/tv/BannerTimeline.java android-tv/app/src/main/java/top/monitorglobal/tv/DemoAlerts.java android-tv/tests/BannerTimelineCheck.java
          java -cp /tmp/tv-java-tests top.monitorglobal.tv.BannerTimelineCheck
      - name: Build and inspect APK
        working-directory: android-tv
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
      - name: Verify distribution guards
        run: python -m unittest discover -s android-tv/tests/python
      - name: Verify published signature and migration artifacts
        run: python android-tv/tools/check-distribution.py "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-global-tv-preview
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

name: Refresh official Meteoalarm area bounds
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: meteoalarm-area-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/update-meteoalarm-areas.py
      - name: Publish reference bounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/meteoalarm-areas.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/meteoalarm-areas.json
          git commit -m 'Refresh official Meteoalarm area reference bounds'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

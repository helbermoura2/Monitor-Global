<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://black-sky-9ba0.terrestre.workers.dev; connect-src 'self' https://server.arcgisonline.com https://black-sky-9ba0.terrestre.workers.dev https://cdn.jsdelivr.net; worker-src blob:; child-src blob:; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Chuva · Argos Orbis</title><link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="phone-rain.css"><link rel="stylesheet" href="phone-boundaries.css"><script defer src="vendor/maplibre-gl.js"></script><script defer src="phone-rain-model.js"></script><script defer src="phone-boundaries.js"></script><script defer src="phone-rain.js"></script></head>
<body class="rain-app"><main>
<section class="map-panel" aria-label="Mapa regional de chuva e previsão por horário"><div id="rain-map"></div>
<div class="map-top"><div class="map-title"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7.5 17.5A5.5 5.5 0 0 1 8 6.6a7 7 0 0 1 13 3.3A4.2 4.2 0 0 1 19 18"/><path d="m7 19-1 2m7-2-1 2m7-2-1 2"/></svg><strong>Chuva na região</strong></div><button id="recenter" type="button" aria-label="Centralizar na Liberdade"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg></button></div>
<div id="map-status" role="status">Carregando mapa de chuva…</div>
<div class="map-bottom"><div class="frame-badge"><span id="frame-kind">NO MAPA</span><strong id="frame-label">Consultando quadros…</strong><small id="map-source">Consultando horário da imagem…</small></div><span class="legend"><i aria-hidden="true"></i><span>Menor → maior</span></span></div></section>
<section class="timeline" aria-label="Horários do mapa"><div class="play-row"><button id="play" type="button" disabled aria-label="Reproduzir animação">▶</button><div class="time-control"><label for="frame">Histórico <span>Previsão →</span></label><input id="frame" type="range" min="0" max="9" value="3" step="1" disabled aria-label="Selecionar horário do mapa"><div class="ticks"><span>−1 h</span><button id="latest" type="button">Atual</button><span>+2 h</span></div></div><button id="refresh" type="button" aria-label="Atualizar chuva"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 3v7h-7"/></svg></button></div></section>
<section class="outlook" aria-label="Previsão de chuva no ponto da Liberdade"><div class="point-heading"><span class="point-dot"></span><strong>NO PONTO MARCADO · <em>LIBERDADE</em></strong><span id="horizon">2 horas</span></div>
<h1 id="headline" role="status">Consultando chuva por minuto…</h1><div id="facts" class="facts"></div><p id="peak-info"></p><p id="selected-point"></p>
<details id="forecast-details"><summary><span>Ver gráfico · próximas 2 horas</span><span class="chevron" aria-hidden="true">⌄</span></summary><div id="chart" aria-label="Gráfico da intensidade prevista"></div></details><p id="forecast-source">Previsão por minuto para o ponto marcado.</p></section>
</main></body></html>

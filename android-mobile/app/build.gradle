plugins { id 'com.android.application' }
// Public Firebase Android configuration only; never a service-account private key.
def pushConfigFile = file('firebase-client.json')
def pushConfig = pushConfigFile.exists() ? new groovy.json.JsonSlurper().parse(pushConfigFile) : [:]
def pushFields = { type, packageId ->
 def client = (pushConfig.client ?: []).find { it.client_info?.android_client_info?.package_name == packageId }
 def values = [PUSH_PROJECT_ID: client ? pushConfig.project_info?.project_id : '', PUSH_SENDER_ID: client ? pushConfig.project_info?.project_number : '', PUSH_APP_ID: client?.client_info?.mobilesdk_app_id, PUSH_API_KEY: client?.api_key?.find()?.current_key]
 values.each { key, value -> type.buildConfigField 'String', key, groovy.json.JsonOutput.toJson(value ?: '') }
}
android {
 namespace 'top.monitorglobal.mobile'
 compileSdk 35
 defaultConfig {
  applicationId 'top.monitorglobal.mobile'
  minSdk 28
  targetSdk 35
  versionCode 11
  versionName '0.1.10'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
 buildFeatures { buildConfig true }
 buildTypes {
  debug { applicationIdSuffix '.dev'; versionNameSuffix '-teste'; resValue 'string', 'app_name', 'Monitor Global · Teste' }
  release { minifyEnabled false; debuggable false; resValue 'string', 'app_name', 'Monitor Global' }
 }
 // Reuse the validated protocol, forecast and flag models without copying the TV application.
 sourceSets {
  main {
   java.srcDirs = ['src/main/java', layout.buildDirectory.dir('generated/phoneModels')]
   assets.srcDir layout.buildDirectory.dir('generated/phoneAssets')
  }
 }
 lint { abortOnError true }
}
tasks.register('preparePhoneAssets', Sync) {
 from('../../android-tv/app/src/main/assets') { include 'fonts/**'; include 'flags/**' }
 from('../../js') { include 'brazil-satellite-model.js'; include 'brazil-satellite.js' }
 from('../../css') { include 'brazil-satellite.css' }
 from('../../data') { include 'brazil-satellite-border.json'; into 'data' }
 from('../../assets/weather') { include 'br-municipalities.json'; into 'data' }
 from('../../vendor') { include 'maplibre-gl.js'; include 'maplibre-gl.css'; into 'vendor' }
 into layout.buildDirectory.dir('generated/phoneAssets')
}
tasks.register('preparePhoneModels', Sync) {
 from('../../android-tv/app/src/main/java') {
  ['Alert','AlertCodec','AlertPairing','MapFrame','BrDates','CountryFlag','RainForecast','WeatherForecast','WeatherBriefing','WeatherBriefingClient'].each { model ->
   include "top/monitorglobal/tv/${model}.java"
  }
 }
 into layout.buildDirectory.dir('generated/phoneModels')
}
tasks.named('preBuild').configure { dependsOn 'preparePhoneAssets', 'preparePhoneModels' }
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.google.firebase:firebase-messaging:24.1.2'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
pushFields(android.buildTypes.debug, 'top.monitorglobal.mobile.dev')
pushFields(android.buildTypes.release, 'top.monitorglobal.mobile')
if (project.hasProperty('phoneUiChecks')) {
 android.sourceSets.test.java.srcDir 'src/nativeMapTest/java'
 android.testOptions.unitTests.includeAndroidResources = true
 dependencies { testImplementation 'org.robolectric:robolectric:4.16.1' }
 tasks.withType(Test).configureEach {
  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
  testLogging { exceptionFormat 'full' }
  maxHeapSize = '1536m'
 }
}

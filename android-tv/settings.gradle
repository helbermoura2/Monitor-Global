// Google-hosted Maven Central mirror serves the same upstream Maven artifacts.
// Prefer it to prevent HTTP 429 on shared CI runners; retain standard repositories.
pluginManagement {
 repositories {
  google()
  maven { name = 'CentralMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
  mavenCentral()
  gradlePluginPortal()
 }
}
dependencyResolutionManagement {
 repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
 repositories {
  google()
  maven { name = 'CentralMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
  mavenCentral()
 }
}
rootProject.name = 'ArgosOrbisTV'
include ':app', ':core'
project(':core').projectDir = file('../android-core')

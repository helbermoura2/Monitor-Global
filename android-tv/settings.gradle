pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
 repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
 repositories {
  // The large host-only Robolectric binary was rate-limited by Maven Central.
  // Resolve this exact module through Google's Maven Central mirror, only for native tests.
  if (providers.gradleProperty('nativeMapChecks').isPresent()) {
   exclusiveContent {
    forRepository { maven { name = 'RobolectricNativeMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2/') } }
    filter { includeModule('org.robolectric', 'nativeruntime-dist-compat') }
   }
  }
  google()
  mavenCentral()
 }
}
rootProject.name = 'ArgosOrbisTV'
include ':app', ':core'
project(':core').projectDir = file('../android-core')

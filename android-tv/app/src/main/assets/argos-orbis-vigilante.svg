<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="859" viewBox="0 0 1328 859" role="img" aria-labelledby="title desc">
<title id="title">Argos Orbis — o olho do vigilante</title>
<desc id="desc">Olho de bronze que pisca ocasionalmente, com radar tecnológico ciano estacionário com ponteiro luminoso girando continuamente em 360 graus. Quatro símbolos representam sismos, meteorologia, oceanos e observação global.</desc>
<defs>
  <radialGradient id="iris-fill" cx="47%" cy="48%" r="64%"><stop stop-color="#0A3E42"/><stop offset=".67" stop-color="#052F35"/><stop offset="1" stop-color="#001A26"/></radialGradient>
  <linearGradient id="beam-grad" x1="0" y1="0" x2=".98" y2="1"><stop stop-color="#4EFFF0" stop-opacity=".05"/><stop offset=".52" stop-color="#26DDD2" stop-opacity=".22"/><stop offset="1" stop-color="#2AFFEE" stop-opacity=".75"/></linearGradient>
  <radialGradient id="pupil"><stop stop-color="#19DCCB"/><stop offset=".75" stop-color="#15CDBE"/><stop offset="1" stop-color="#0BAAAB"/></radialGradient>
  <filter id="micro-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="eye-aperture" clipPathUnits="userSpaceOnUse"><path d="M 125 430 Q 664 -94 1201 430 Q 664 954 125 430 Z"><animate attributeName="d" dur="11s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.81;0.830;0.845;0.860;0.881;1" values="M 125 430 Q 664 -94 1201 430 Q 664 954 125 430 Z;M 125 430 Q 664 -94 1201 430 Q 664 954 125 430 Z;M 125 430 Q 664 240 1201 430 Q 664 620 125 430 Z;M 125 430 Q 664 428 1201 430 Q 664 432 125 430 Z;M 125 430 Q 664 240 1201 430 Q 664 620 125 430 Z;M 125 430 Q 664 -94 1201 430 Q 664 954 125 430 Z;M 125 430 Q 664 -94 1201 430 Q 664 954 125 430 Z"/></path></clipPath>
</defs>
<style>
  #radar-pointer { transform-origin:664px 430px; transform-box:view-box; animation:radar-orbit 7.2s linear infinite; will-change:transform; }
  .radar-glow { animation:soft-pulse 4.4s ease-in-out infinite; }
  @keyframes radar-orbit { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes soft-pulse { 0%,100%{opacity:.72} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { #radar-pointer, .radar-glow { animation:none; } }
</style>
<!-- Inscrições e desenho preservados; fundo externo transparente -->

<text x="664" y="111" text-anchor="middle" fill="#BFA274" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="400" letter-spacing="12">ΠΑΝΟΠΤΗΣ</text>
<text x="664" y="808" text-anchor="middle" fill="#C6A677" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="400" letter-spacing="11">CUSTOS ORBIS</text>

<!-- Quatro ornamentos greco-romanos, relacionados às áreas do projeto. -->
<!-- Grego, superior esquerdo: sismos — meandro que vira pulso sísmico. -->
<g transform="translate(377 170)" fill="none" stroke="#AF8C57" stroke-width="4.3" stroke-linecap="square" stroke-linejoin="miter" opacity=".92">
 <path d="M-45 -28H-15V-7H-32V10H-14L0 -14L15 27L27 -4H44"/>
 <path d="M-45 28H-29V17" stroke-width="2.3" opacity=".66"/>
</g>
<!-- Romano, superior direito: meteorologia e orientação — rosa dos ventos. -->
<g transform="translate(934 169)" stroke="#AF8C57" stroke-width="3" fill="none" opacity=".92">
  <circle r="34" opacity=".8"/><circle r="19" stroke-width="1.8" opacity=".66"/>
  <path d="M0 -45V-34M0 34V45M-45 0H-34M34 0H45" stroke-width="2.8"/>
  <path d="M0 -32L9 -9L32 0L9 9L0 32L-9 9L-32 0L-9 -9Z" stroke-width="2.2"/>
  <path d="M0 -32L9 -9L0 0L-9 -9Z" fill="#BCA171" opacity=".9" stroke="none"/>
  <circle r="3.2" fill="#BCA171" stroke="none"/>
</g>
<!-- Grego, inferior esquerdo: ondas do mar e ciclones. -->
<g transform="translate(379 693)" stroke="#AF8C57" stroke-width="4.1" fill="none" opacity=".92" stroke-linecap="round">
 <path d="M-49 12C-37 -9 -18 -9 -9 4C-1 18 -13 24 -21 17C-26 10 -20 4 -15 6"/>
 <path d="M-7 12C5 -9 24 -9 33 4C41 18 29 24 21 17C16 10 22 4 27 6"/>
 <path d="M-48 27H48" stroke-width="2.2" opacity=".65"/>
</g>
<!-- Romano, inferior direito: observação global — esfera armilar. -->
<g transform="translate(934 686)" fill="none" stroke="#AF8C57" opacity=".92">
 <circle r="37" stroke-width="3.5"/>
 <ellipse rx="17" ry="37" stroke-width="2.4"/>
 <ellipse rx="37" ry="15" transform="rotate(-27)" stroke-width="3.2"/>
 <path d="M-42 0H42M0 -44V44" stroke-width="1.5" opacity=".68"/>
 <circle r="5" fill="#BDA06E" stroke="none"/>
</g>


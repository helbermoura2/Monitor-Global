  </g>
  <!-- Somente o ponteiro e o feixe luminoso percorrem 360 graus. -->
  <g id="radar-pointer">
    <path d="M664 430 L877.8 579.7 A261 261 0 0 1 766.0 670.3Z" fill="url(#beam-grad)" opacity=".72"/>

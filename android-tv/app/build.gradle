plugins { id 'com.android.application' }
android {
 namespace 'top.monitorglobal.tv'
 compileSdk 35
 defaultConfig {
  applicationId 'top.monitorglobal.tv.preview'
  minSdk 28
  targetSdk 35
  versionCode 10013
  versionName '1.0.13'
  def identity = new groovy.json.JsonSlurper().parse(file('../signing/identity.json'))
  buildConfigField 'String', 'OFFICIAL_SIGNER_SHA256', '"' + identity.certificateSha256 + '"'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
 buildFeatures { buildConfig true }
 buildTypes {
  debug { applicationIdSuffix '.dev'; versionNameSuffix '-dev'; resValue 'string', 'app_name', 'Monitor Global TV · Desenvolvimento' }
  release { minifyEnabled false; debuggable false; resValue 'string', 'app_name', 'Monitor Global TV' }
 }
 lint { abortOnError true }
}
// JVM-only codec tests; the shipped APK gains no runtime dependencies.
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}

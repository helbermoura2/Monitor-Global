plugins { id 'com.android.application' }
android {
 namespace 'top.monitorglobal.tv'
 compileSdk 35
 defaultConfig {
  applicationId 'top.monitorglobal.tv.preview'
  minSdk 28
  targetSdk 35
  versionCode 10023
  versionName '1.0.23'
  def identity = new groovy.json.JsonSlurper().parse(file('../signing/identity.json'))
  buildConfigField 'String', 'OFFICIAL_SIGNER_SHA256', '"' + identity.certificateSha256 + '"'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
 buildFeatures { buildConfig true }
 buildTypes {
  debug { applicationIdSuffix '.dev'; versionNameSuffix '-dev'; resValue 'string', 'app_name', 'Monitor Global TV · Desenvolvimento' }
  release { minifyEnabled false; debuggable false; resValue 'string', 'app_name', 'Monitor Global TV' }
 }
 lint { abortOnError true }
}
// QR encoding is local; no camera permission or remote QR service.
dependencies {
 implementation 'com.google.zxing:core:3.5.3'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}

// Opt-in host Android graphics checks; no dependencies are added to the shipped APK.
if (project.hasProperty('nativeMapChecks')) {
 android.sourceSets.test.java.srcDir 'src/nativeMapTest/java'
 android.testOptions.unitTests.includeAndroidResources = true
 dependencies { testImplementation 'org.robolectric:robolectric:4.16.1' }
 tasks.withType(Test).configureEach {
  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
  ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort', 'javax.net.ssl.trustStore'].each { key ->
   if (System.getProperty(key)) systemProperty key, System.getProperty(key)
  }
  maxHeapSize = '1536m'
 }
}

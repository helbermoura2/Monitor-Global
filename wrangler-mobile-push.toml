name = "monitor-global-mobile-push"
main = "worker/mobile-push.mjs"
compatibility_date = "2026-11-01"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "MOBILE_PUSH"
class_name = "MobilePushDelivery"

[[migrations]]
tag = "mobile-push-v1"
new_sqlite_classes = ["MobilePushDelivery"]

# FIREBASE_SERVICE_ACCOUNT must be a Worker Secret, never committed or shipped in an APK.
